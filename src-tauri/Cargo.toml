[package]
name = "parler"
version = "0.1.7"
description = "Speak, and your words appear wherever you type."
authors = ["Synapsr"]
license = "MIT"
repository = "https://github.com/Synapsr/Parler"
homepage = "https://parler.synapsr.io"
keywords = ["dictation", "speech-to-text", "whisper", "voice-typing", "tauri"]
categories = ["accessibility", "multimedia::audio"]
edition = "2021"
# handy-recorder (microphone capture) needs 1.88.
rust-version = "1.88"

[lib]
name = "parler_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "tray-icon", "image-png"] }
tauri-plugin-autostart = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-log = "2"
tauri-plugin-macos-permissions = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"

# Microphone capture, resampled to 16 kHz mono. Extracted from Handy.
handy-recorder = "0.1"
hound = "3.5"
reqwest = { version = "0.12", features = ["json", "multipart"] }
arboard = "3"
enigo = "0.6"
tauri-plugin-updater = "2"
# Hashes a downloaded speech model before it is used (see local.rs).
sha2 = "0.10"
# The system's language, which picks the recommended speech model when the
# interface follows it (already in the tree through tauri).
sys-locale = "0.3"

# Transcription on this computer (local.rs). The native library is built
# from source with CMake. Apple Silicon runs it on the GPU through Metal,
# linked in with its shaders. Intel Macs run it on the CPU, built in for a
# portable floor (SSE4.2, AVX, F16C): Metal on Intel and AMD GPUs gains little
# and its shader compile can hang on some of them.
[target.'cfg(all(target_os = "macos", target_arch = "aarch64"))'.dependencies]
transcribe-cpp = { version = "0.4.1", default-features = false, features = ["metal"] }

[target.'cfg(all(target_os = "macos", target_arch = "x86_64"))'.dependencies]
transcribe-cpp = { version = "0.4.1", default-features = false }

# Windows and Linux: the GPU through Vulkan when a driver offers one
# (integrated GPUs included), else the CPU. Both come as modules loaded at
# launch, so Parler starts without any Vulkan installed; the CPU code comes
# as one module per instruction set, from plain x86-64 to AVX-512, and the
# fastest this processor runs is picked. build.rs stages the modules and the
# bundles ship them next to Parler.
[target.'cfg(any(windows, target_os = "linux"))'.dependencies]
transcribe-cpp = { version = "0.4.1", default-features = false, features = ["dynamic-backends", "vulkan"] }

[target.'cfg(target_os = "macos")'.dependencies]
# Turns the overlay into a non-activating panel, so showing it never takes
# focus away from the app the text is pasted into.
tauri-nspanel = { git = "https://github.com/ahkohd/tauri-nspanel", branch = "v2.1" }
# The event tap that follows the fn key (already in the tree through enigo
# and tao).
core-foundation = "0.10"
core-graphics = "0.25"
# The pasteboard saved and put back in full around a paste, every type of
# every item (already in the tree through arboard and tao).
objc2 = "0.6.5"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSPasteboard", "NSPasteboardItem"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSArray", "NSData", "NSString"] }

[target.'cfg(windows)'.dependencies]
# DataExchange tells an empty clipboard from one Parler can't read; the audio
# endpoint mutes the sound while dictating.
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_System_DataExchange", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Variant", "Win32_Media_Audio", "Win32_Media_Audio_Endpoints"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true

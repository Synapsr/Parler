name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

# One release at a time.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    name: Bundle ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # One universal app for Apple Silicon and Intel Macs.
          - label: macOS (universal)
            os: macos-latest
            target: universal-apple-darwin
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
            artifact_glob: |
              src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          - label: Windows (x64)
            os: windows-latest
            target: x86_64-pc-windows-msvc
            rust_targets: x86_64-pc-windows-msvc
            artifact_glob: |
              src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi
              src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
          # The oldest supported Ubuntu, so the AppImage runs on more distros.
          - label: Linux (x64)
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            rust_targets: x86_64-unknown-linux-gnu
            artifact_glob: |
              src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/deb/*.deb
              src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/rpm/*.rpm
              src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/appimage/*.AppImage
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf \
            libasound2-dev libpulse-dev libssl-dev \
            libx11-dev libxtst-dev libxrandr-dev libxkbcommon-dev pkg-config

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.target }}

      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Apple signing + notarization, as in Synapsr/Aircast.
      #
      # tauri-bundler checks `var_os("APPLE_CERTIFICATE")`, and GitHub expands
      # a missing secret to "", which var_os reports as Some(""): the bundler
      # then imports an empty certificate and the build dies. So the variables
      # are only exported when really set, and a fork without secrets still
      # builds (unsigned) instead of failing.
      - name: Stage Apple signing secrets
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_B64: ${{ secrets.APPLE_API_KEY_B64 }}
        run: |
          set -euo pipefail
          if [ -z "${APPLE_CERTIFICATE:-}" ]; then
            echo "::notice::No Apple signing secrets configured — building unsigned."
            exit 0
          fi
          {
            printf 'APPLE_CERTIFICATE<<__PARLER_EOF__\n%s\n__PARLER_EOF__\n' "$APPLE_CERTIFICATE"
            printf 'APPLE_CERTIFICATE_PASSWORD<<__PARLER_EOF__\n%s\n__PARLER_EOF__\n' "$APPLE_CERTIFICATE_PASSWORD"
          } >> "$GITHUB_ENV"
          echo "::notice::Developer ID signing enabled."

          # Exported under names Tauri does NOT read, so tauri-bundler never
          # blocks on Apple's notary service itself; the step below does it
          # with a timeout we control.
          if [ -n "${APPLE_API_KEY_B64:-}" ]; then
            keydir="$RUNNER_TEMP/private_keys"
            mkdir -p "$keydir"
            printf '%s' "$APPLE_API_KEY_B64" | base64 --decode > "$keydir/AuthKey_${APPLE_API_KEY}.p8"
            chmod 600 "$keydir/AuthKey_${APPLE_API_KEY}.p8"
            {
              echo "NOTARY_KEY_ID=${APPLE_API_KEY}"
              echo "NOTARY_ISSUER=${APPLE_API_ISSUER}"
              echo "NOTARY_KEY_PATH=$keydir/AuthKey_${APPLE_API_KEY}.p8"
            } >> "$GITHUB_ENV"
            echo "::notice::Notarization enabled."
          else
            echo "::warning::Signing without notarization — macOS will still warn users."
          fi

      - name: Build Tauri bundle
        run: pnpm tauri build --target ${{ matrix.target }}

      # Nothing is published unless Apple accepted the build and the ticket is
      # stapled into the .dmg users download. A congested notary service
      # delays the release rather than shipping an unverifiable one.
      - name: Notarize and staple the DMG
        if: runner.os == 'macOS' && env.NOTARY_KEY_PATH != ''
        shell: bash
        run: |
          set -uo pipefail
          dmg=$(find "src-tauri/target/${{ matrix.target }}/release/bundle/dmg" -name '*.dmg' | head -1)
          if [ -z "$dmg" ]; then
            echo "::error::No .dmg produced."
            exit 1
          fi
          auth=(--key "$NOTARY_KEY_PATH" --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER")

          id=$(xcrun notarytool submit "$dmg" "${auth[@]}" --output-format json | jq -r '.id')
          if [ -z "$id" ] || [ "$id" = "null" ]; then
            echo "::error::Could not reach the notary service."
            exit 1
          fi
          echo "Submission id: $id"

          # Polled rather than `--wait`, so a rejection and a timeout stay
          # distinguishable.
          : "${NOTARY_MAX_MINUTES:=180}"
          polls=$(( NOTARY_MAX_MINUTES * 2 ))
          status="In Progress"
          for i in $(seq 1 "$polls"); do
            sleep 30
            status=$(xcrun notarytool info "$id" "${auth[@]}" --output-format json | jq -r '.status')
            [ $(( i % 2 )) -eq 0 ] && echo "  [$(( i / 2 )) min] $status"
            [ "$status" = "In Progress" ] || break
          done

          case "$status" in
            Accepted)
              xcrun stapler staple "$dmg"
              xcrun stapler validate "$dmg"
              ;;
            Invalid|Rejected)
              echo "::error::Apple rejected this build."
              xcrun notarytool log "$id" "${auth[@]}" || true
              exit 1
              ;;
            *)
              echo "::error::Apple did not answer within ${NOTARY_MAX_MINUTES} min (status: $status). Re-run once their queue clears."
              exit 1
              ;;
          esac

      - uses: actions/upload-artifact@v4
        with:
          name: parler-${{ matrix.target }}
          path: ${{ matrix.artifact_glob }}
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # Stable names, so https://github.com/Synapsr/Parler/releases/latest/download/<name>
      # always points at the newest build: the website and Parler Cloud link to them.
      - name: Give the downloads stable names
        working-directory: dist
        run: |
          set -euo pipefail
          rename() {
            local found
            found=$(find . -type f -name "$1" | head -1)
            if [ -z "$found" ]; then echo "::error::No $1 to publish."; exit 1; fi
            mv "$found" "./$2"
          }
          rename '*.dmg' Parler-macOS.dmg
          rename '*-setup.exe' Parler-Windows-x64-setup.exe
          rename '*.msi' Parler-Windows-x64.msi
          rename '*.AppImage' Parler-Linux-x86_64.AppImage
          rename '*.deb' Parler-Linux-amd64.deb
          rename '*.rpm' Parler-Linux-x86_64.rpm
          ls -la

      # Lets anyone check a download with `sha256sum -c SHA256SUMS`.
      - name: Generate SHA256SUMS
        working-directory: dist
        run: |
          set -euo pipefail
          : > SHA256SUMS
          find . -type f \( -name '*.dmg' -o -name '*.msi' -o -name '*.exe' \
            -o -name '*.deb' -o -name '*.rpm' -o -name '*.AppImage' \) -print0 \
            | sort -z \
            | while IFS= read -r -d '' f; do
                printf '%s  %s\n' "$(sha256sum "$f" | cut -d' ' -f1)" "$(basename "$f")"
              done >> SHA256SUMS
          cat SHA256SUMS

      # Ties every artifact to this workflow run and commit:
      #   gh attestation verify <file> --repo Synapsr/Parler
      - uses: actions/attest-build-provenance@v4
        with:
          subject-checksums: dist/SHA256SUMS

      - uses: softprops/action-gh-release@v2
        with:
          name: Parler ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist/SHA256SUMS
            dist/**/*.dmg
            dist/**/*.msi
            dist/**/*.exe
            dist/**/*.deb
            dist/**/*.rpm
            dist/**/*.AppImage
